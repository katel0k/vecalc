	<script type="text/javascript">
		let v = Vector({
			sx: [new Num(2)],
			sy: [new Num(3), minus, new Num(2)],
			vx: [new Num(1), plus, new Num(2)],
			vy: [new Num()],
			mode: 'orts'
		});
		let v1 = Vector({
			abs: [v.absV, plus, new Num(1)],
			angle: [new Num('pi'), div, new Num(3)],
			mode: 'abs'
		});
		let v2 = Vector({
			formule: [v, plus, v1],
			mode: 'formule'
		})
	</script>
	<table id="table">
		<th>
			<td>sx</td>
			<td>sy</td>
			<td>vx</td>
			<td>vy</td>
			<td>abs</td>
			<td>angle</td>
			<td></td>
			<td></td>
			<td></td>
			<td></td>
		</th>
	</table>
	<script type="text/javascript">
		setInterval(function () {
			let newTable = document.createElement('table');
			newTable.innerHTML = `<th>
			<td>sx</td>
			<td>sy</td>
			<td>vx</td>
			<td>vy</td>
			<td>abs</td>
			<td>angle</td>
			<td></td>
			<td></td>
			<td></td>
			<td></td>
			<td></td>
			<td></td>
			<td></td>
		</th>`
			for (let i = 0; i < vectors.length; i++) {
				newTable.append(document.createElement('tr'));
				for (let param in vectors[i]) {
					newTable.lastElementChild.append(document.createElement('td'));
					newTable.lastElementChild.lastElementChild.innerHTML = vectors[i][param];
				}
			}

			document.body.replaceChild(newTable, table);

			newTable.id = 'table';
		}, 1000);
	</script>
