<!DOCTYPE html>
<html lang="en">
<head>
	<!-- https://colorscheme.ru/#3C61BvlYIw0w0 -->
	<meta charset="UTF-8">
	<title>Document</title>
	<link href="https://fonts.googleapis.com/css?family=Inconsolata|Roboto&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="../../vc/build/fontawesome/css/all.css">
	<link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>
	<div class="wrapper">
		<div class="canvas wrapper__canvas">
			<div class="canvas__buttons">
				<div class="btn" data-action="inc"><i class="fas fa-plus"></i></div>
				<div class="btn" data-action="dec"><i class="fas fa-minus"></i></div>
				<div class="btn btn_hidden" data-action="home"><i class="fas fa-home"></i></div>
			</div>
			<canvas id="main"></canvas>
		</div>
		<div class="overflow wrapper__overflow">
			<div class="VList noScroll-y">
				<div class="inner-VList">
					<button class="btn VList__btn vector VList__newVector"><i class="fas fa-plus"></i></button>
				</div>
			</div>
			<div class="VCalc">
				<div class="buttons VCalc__buttons">
					<button class="btn" data-area="complexDiv">
						<svg width="25%" height="37">
							<rect x="1" y="0" width="14" height="15" fill="none" stroke="white" stroke-width="2"/>
							<line x1="1" y1="18" x2="14" y2="18" stroke="white" stroke-width="2"/>
							<rect x="1" y="21" width="14" height="15" fill="none" stroke="white" stroke-width="2"/>
						</svg>
					</button>
					<button class="btn" data-area="root">
						<svg width="80%" height="30">
							<polyline points="0, 15, 10, 15, 15, 30, 20, 0, 50, 0" fill="none" stroke="white" stroke-width="2"/>
							<rect x="29" y="7" width="15" height="20" fill="transparent" stroke="white" stroke-width="2"/>
						</svg>
					</button>
					<button class="btn" data-area="pow">
						<div>x<sup>
							<svg width="10" height="20"><rect x="0" y="0" width="10" height="20" fill="transparent" stroke="white" stroke-width="2"/></svg>
						</sup></div>
					</button>
					<button class="btn" data-area="sqr">
						<div>x<sup>2</sup></div>
					</button>
					<button class="btn" data-area="pi">
						<img src="./Pi.svg" width="30" height="30"></img>
					</button>
					<button class="btn" data-area="opBracket">(</button>
					<button class="btn" data-area="clBracket">)</button>
					<button class="btn" data-area="sin">sin</button>
					<button class="btn" data-area="cos">cos</button>
					<button class="btn" data-area="tan">tan</button>
					<button class="btn" data-area="seven">7</button>
					<button class="btn" data-area="eight">8</button>
					<button class="btn" data-area="nine">9</button>
					<button class="btn" data-area="plus">+</button>
					<button class="btn" data-area="mul">x</button>
					<button class="btn" data-area="four">4</button>
					<button class="btn" data-area="five">5</button>
					<button class="btn" data-area="six">6</button>
					<button class="btn" data-area="minus">-</button>
					<button class="btn" data-area="div">/</button>
					<button class="btn" data-area="one">1</button>
					<button class="btn" data-area="two">2</button>
					<button class="btn" data-area="three">3</button>
					<button class="btn" data-area="delete"><i class="fas fa-backspace"></i></button>
					<button class="btn" data-area="allClear">AC</button>
					<button class="btn" data-area="zero">0</button>
					<button class="btn" data-area="dot">.</button>
					<button class="btn" data-area="scalar">,</button>
					<button class="btn" data-area="result">=</button>
				</div>
				<div class="input VCalc__input">
					<div class="fi"></div>
				</div>
				<div class="error-field VCalc__error-field noScroll-y">
					<div class="inner-error-field inner-error-field_empty"> <!-- inner-error-field_empty -->
						<span class="error__info">
							Здесь будут появляться ошибки
						</span>
						
					</div>
				</div>
			</div>
			<div class="overflow-hide wrapper__overflow-hide transparent-btn">
				<i class="fas fa-caret-down fa-2x"></i>
			</div>
		</div>
		<div class="wrapper__overflow-open overflow-open overflow-open_hidden transparent-btn" id="overflow-open">
			<i class="fas fa-bars fa-2x"></i>
		</div>
		<div class="overflow vs" id="vs-template">
			<div class="console vs__console" draggable>
				<span class="console__info"></span>
				<button class="overflow-hide vs__overflow-hide transparent-btn"><i class="fas fa-times"></i></button>
			</div>
			<div class="vs__UI">
				<div class="setting-section" data-unchosable>
					<div class="setting" data-param="sx">
						<span class="info">x</span>
						<div class="value">
							<div class="fi"></div>
						</div>
					</div>
					<div class="setting" data-param="sy">
						<span class="info">y</span>
						<div class="value">
							<div class="fi"></div>
						</div>
					</div>
				</div>
				<div class="setting-section">
					<div class="setting" data-param="vx">
						<span class="info">i</span>
						<div class="value">
							<div class="fi"></div>
						</div>
					</div>
					<div class="setting" data-param="vy">
						<span class="info">j</span>
						<div class="value">
							<div class="fi"></div>
						</div>
					</div>
				</div>
				<div class="setting-section">
					<div class="setting" data-param="abs">
						<span class="info">
							<svg width="9.6" height="16">
								<line x1="1.9" y1="0" x2="1.9" y2="22.4" stroke="white" stroke-width="2"/>
								<line x1="5.8" y1="0" x2="5.8" y2="22.4" stroke="white" stroke-width="2"/>
							</svg>
						</span>
						<div class="value">
							<div class="fi"></div>
						</div>
					</div>
					<div class="setting" data-param="angle">
						<span class="info">
							<svg width="11" height="17">
								<polyline points="10, 1, 1, 16, 10, 16" fill="transparent" stroke="white" stroke-width="3"/>
							</svg>
						</span>
						<div class="value">
							<div class="fi"></div>
						</div>
					</div>
				</div>
				<div class="setting-section">
					<div class="setting" data-param="formule">
						<span class="info">f</span>
						<div class="value">
							<div class="fi"></div>
						</div>
					</div>
				</div>
				<div class="setting-section" data-unchosable>
					<div class="setting setting-last">
						<input type="checkbox" name="" class="setting__checkbox">
						<label for="" class="btn setting__label" data-param="rad">
							<span>R</span>
						</label>
					</div>
					<div class="setting setting-last">
						<input type="checkbox" name="" class="setting__checkbox">
						<label for="" class="btn setting__label" data-param="locked">
							<span><i class="fas fa-lock"></i></span>
						</label>
					</div>
					<div class="setting setting-last">
						<input type="checkbox" name="" class="setting__checkbox" checked>
						<label for="" class="btn setting__label" data-param="visible">
							<span><i class="far fa-eye"></i></span>
						</label>
					</div>
					<div class="setting setting-last" >
						<input type="checkbox" name="" class="setting__checkbox">
						<label for="" class="btn setting__label" data-param="color"></label>
					</div>
					<div class="setting setting-last">
						<input type="button" name="" class="setting__checkbox">
						<label for="" class="btn setting__label" data-param="delete">
							<span><i class="fas fa-times"></i></span>
						</label>
					</div>
				</div>
			</div>
		</div>
	</div>
	<button class="btn VList__btn vector" data-index="0" id="vector-template"></button>
	<div class="error" id="error-template">
		<button class="error__look-place btn"><i class="far fa-eye"></i></button>
		<div class="error__text">
			<span class="error__text-span"></span>
		</div>
	</div>
	<script type="text/javascript" src="./bundle.js"></script>
</body>
</html>
